# render.yaml — Blueprint TEST (image publique, free plan, sans persistance)
# ⚠️ free plan = SQLite éphémère (résas perdues au redeploy/sleep)
# Pour prod client : voir deploy/render.client.yaml dans le repo source RestauKit
# (starter $7/mo + disque + image privée + creds GHCR)

services:
  - type: web
    name: restaukit
    runtime: image
    image:
      url: ghcr.io/eliesse/restaukit:v0.1.7
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # SMTP bloqué sur Render free -> utiliser l'API HTTP Brevo (port 443)
      - key: BREVO_API_KEY
        sync: false
      # Fallback SMTP (ignoré si BREVO_API_KEY défini)
      - key: BREVO_SMTP_LOGIN
        sync: false
      - key: BREVO_SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_BASE_URL
        sync: false  # ex: https://restaukit-demo.onrender.com
      - key: DATABASE_URL
        value: /tmp/booking.db
